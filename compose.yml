# Cronus in Docker.
#
#   docker compose up --build
#
# Storage defaults to SQLite in the `cronus-save` volume — no database service needed.
# The client (via EmuClient) connects to 127.0.0.1:8484; on character select the server
# hands it to the picked channel at 7575/7576, and the cash shop rides the next port
# (7577 with 2 channels) — all published below.
#
# To play with maps/NPCs/shops, mount your data and point the CRONUS_* vars at it
# (see .env.example for what each does).

services:
  cronus:
    build: .
    environment:
      # SQLite file inside the persistent volume (survives container rebuilds).
      CRONUS_DB_FILE: "/data/save/cronus.db"
      CRONUS_SCRIPTS: "/data/scripts"
      # Mount a wz_xml tree and drop/shop dumps, then uncomment:
      # CRONUS_WZ: "/data/wz"
      # CRONUS_DROPS: "/data/sql/drop_data.sql"
      # CRONUS_SHOPS: "/data/sql/init_data_set.sql"
      # Friends over the network: the IP/hostname clients should connect to.
      # CRONUS_HOST: "203.0.113.9"
    ports:
      - "8484:8484"   # login
      - "7575:7575"   # channel 1
      - "7576:7576"   # channel 2
      - "7577:7577"   # cash shop (first port after the channels)
    volumes:
      - cronus-save:/data/save
      - ./scripts:/data/scripts:ro
      # - /path/to/wz_xml:/data/wz:ro
      # - /path/to/sql:/data/sql:ro

  # Optional: MySQL instead of SQLite. Start with
  #   docker compose --profile mysql up --build
  # and set on the cronus service:
  #   CRONUS_DB: "server=db;port=3306;database=cronus;user=root;password=cronus"
  db:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: cronus
      MYSQL_DATABASE: cronus
    ports:
      - "3306:3306"
    volumes:
      - cronus-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcronus"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cronus-save:
  cronus-db:
